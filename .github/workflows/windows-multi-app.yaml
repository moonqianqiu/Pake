name: Build Multi Apps (Windows Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-multi-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Multi Apps (Windows, Serial)
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      # App list: edit here to add/remove apps. Set "enabled": false to skip one.
      APPS_JSON: |
        [
          { "title": "DouBao",      "name": "DouBao",      "url": "https://www.doubao.com/chat",    "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/doubao.png",     "enabled": true },
          { "title": "HunYuan",     "name": "HunYuan",     "url": "https://aistudio.tencent.ai",    "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/hunyuan.png",    "enabled": true },
          { "title": "ChatGLM",     "name": "ChatGLM",     "url": "https://chatglm.cn",             "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/qingyan.png",    "enabled": true },
          { "title": "TongYi",      "name": "TongYi",      "url": "https://www.qianwen.com/",       "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/tongyi.png",     "enabled": true },
          { "title": "Kimi",        "name": "Kimi",        "url": "https://www.kimi.com",           "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/kimi.png",       "enabled": true },
          { "title": "Qwen",        "name": "Qwen",        "url": "https://chat.qwen.ai",           "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/qwen.png",       "enabled": true },
          { "title": "Z",           "name": "Z",           "url": "https://chat.z.ai",              "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/zai.png",        "enabled": true },
          { "title": "Minimax",     "name": "Minimax",     "url": "https://agent.minimaxi.com",     "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/minimax.png",    "enabled": true },
          { "title": "HuggingChat", "name": "HuggingChat", "url": "https://huggingface.co/chat",    "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/huggingface.png","enabled": true },
          { "title": "MIMO",        "name": "MIMO",        "url": "https://aistudio.xiaomimimo.com","icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/xiaomimimo.png", "enabled": true },
          { "title": "Copilot",     "name": "Copilot",     "url": "https://copilot.microsoft.com",  "icon": "https://raw.githubusercontent.com/moonqianqiu/STORE/refs/heads/main/ICONS/copilot.png",    "enabled": false }
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        shell: pwsh
        run: pnpm run cli:build

      - name: Verify CLI
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem dist -Force | Format-Table -AutoSize }
          if (-not (Test-Path "dist/cli.js")) { throw "dist/cli.js not found" }

      - name: Build Apps (Windows, Serial) -> ZIP portable
        shell: pwsh
        timeout-minutes: 160
        run: |
          # App list comes from the job-level APPS_JSON env; entries with
          # "enabled": false are skipped, so commenting out an app is unnecessary
          $apps = $env:APPS_JSON | ConvertFrom-Json | Where-Object { $_.enabled -ne $false }

          if (-not $apps -or @($apps).Count -eq 0) { throw "No enabled apps in APPS_JSON" }
          Write-Host "Apps to build: $(@($apps | ForEach-Object { $_.title }) -join ', ')"

          New-Item -Path "output\windows" -ItemType Directory -Force | Out-Null

          # Do not use Resolve-Path here; target may not exist before the first build
          $tauriTargetRoot = Join-Path (Get-Location).Path "src-tauri\target"
          $triple = "x86_64-pc-windows-msvc"

          foreach ($app in $apps) {
            Write-Host ""
            Write-Host "=============================="
            Write-Host "Building: $($app.title)"
            Write-Host "=============================="

            # No arch suffix in the name, so "extract each to its own folder"
            # creates a folder named exactly after the app
            $zipPath = "output\windows\$($app.title).zip"
            if (Test-Path $zipPath) { Remove-Item -Force $zipPath }

            # Clear possible bundle dirs before build
            # Do not decide the final releaseDir yet; it may not exist until after build
            $bundleDirs = @(
              (Join-Path $tauriTargetRoot "$triple\release\bundle"),
              (Join-Path $tauriTargetRoot "release\bundle")
            )

            foreach ($dir in $bundleDirs) {
              if (Test-Path $dir) {
                Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
              }
            }

            $args = @(
              $app.url,
              "--name", $app.name,
              "--icon", $app.icon,
              "--width", "1366",
              "--height", "768",
              "--targets", "x64",
              "--iterative-build"
            )

            Write-Host "Running: node dist/cli.js $($args -join ' ')"
            $before = Get-Date
            node dist/cli.js $args
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $($app.title)" }

            # Determine release directory after build
            $releaseDirTriple = Join-Path $tauriTargetRoot "$triple\release"
            $releaseDirPlain  = Join-Path $tauriTargetRoot "release"

            if (Test-Path $releaseDirTriple) {
              $releaseDir = $releaseDirTriple
            } elseif (Test-Path $releaseDirPlain) {
              $releaseDir = $releaseDirPlain
            } else {
              Write-Host "target tree under $tauriTargetRoot :"
              if (Test-Path $tauriTargetRoot) {
                Get-ChildItem -Path $tauriTargetRoot -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                  Select-Object FullName |
                  Format-Table -AutoSize
              }
              throw "Release directory not found. Checked: $releaseDirTriple and $releaseDirPlain"
            }

            Write-Host "Using releaseDir: $releaseDir"

            # EXE selection:
            # - First: deterministic path <releaseDir>\<name>.exe (the CLI names the exe after --name)
            # - Fallback: newest exe written after the build started whose name matches, else newest
            $exe = $null
            $deterministic = Join-Path $releaseDir "$($app.name).exe"
            if (Test-Path $deterministic) {
              $exe = Get-Item $deterministic
            }

            if (-not $exe) {
              $exeCandidatesAll = Get-ChildItem -Path $releaseDir -Filter "*.exe" -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -ge $before.AddSeconds(-10) } |
                Sort-Object LastWriteTime -Descending

              $k1 = $app.name.ToLower()
              $k2 = $app.title.ToLower()

              $exe = $exeCandidatesAll |
                Where-Object {
                  $n = $_.Name.ToLower()
                  ($n -like "*$k1*") -or ($n -like "*$k2*")
                } |
                Select-Object -First 1

              if (-not $exe) {
                $exe = $exeCandidatesAll | Select-Object -First 1
              }
            }

            if (-not $exe) {
              Write-Host "EXEs under ${releaseDir}:"
              Get-ChildItem -Path $releaseDir -Filter "*.exe" -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 30 |
                Format-Table -AutoSize
              throw "No EXE found for $($app.title). releaseDir=${releaseDir}"
            }

            # Package as ZIP: unzip to run
            $tmpDir = Join-Path $env:RUNNER_TEMP "pake_portable_$($app.title)"
            if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
            New-Item -ItemType Directory -Path $tmpDir | Out-Null

            Copy-Item $exe.FullName -Destination (Join-Path $tmpDir "$($app.title).exe") -Force
            Compress-Archive -Path (Join-Path $tmpDir "*") -DestinationPath $zipPath -Force

            # Verify the zip exists and is not empty
            if (-not (Test-Path $zipPath)) { throw "ZIP was not created: $zipPath" }
            $zipItem = Get-Item $zipPath
            if ($zipItem.Length -lt 1MB) { throw "ZIP suspiciously small ($($zipItem.Length) bytes): $zipPath" }

            # Keep repo clean (if tooling changes lockfiles)
            if (Test-Path "src-tauri/Cargo.lock") {
              git checkout -- src-tauri/Cargo.lock
            }

            $elapsed = ((Get-Date) - $before).ToString("hh\:mm\:ss")
            Write-Host "Done in $elapsed : $zipPath ($('{0:N1}' -f ($zipItem.Length / 1MB)) MB, from $($exe.FullName))"
          }

      - name: sccache stats
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
            sccache --version
          } else {
            Write-Warning "sccache not found in PATH"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-multi-apps-${{ github.run_number }}-${{ github.sha }}
          path: output/windows/*.zip
          retention-days: 3
